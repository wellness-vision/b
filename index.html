<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Modelo 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f5f5f5}main{height:100%;display:flex;flex-direction:column}header{padding:14px 20px;background:#fff;border-bottom:1px solid #ddd;font-size:17px;font-weight:600}model-viewer{width:100%;flex:1;min-height:0;background:#f5f5f5}#status{position:absolute;bottom:20px;left:20px;right:20px;text-align:center;background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 12px #0002;font-size:13px}#status[hidden]{display:none}</style></head>
<body><main><header>Modelo 3D</header><model-viewer id="viewer" src="./modelo.glb" alt="Modelo tridimensional interactivo" camera-controls auto-rotate rotation-per-second="10deg" shadow-intensity="0.6" environment-image="neutral" exposure="1" interaction-prompt="auto" loading="eager"><div slot="progress-bar"></div></model-viewer></main><div id="status">Cargando modelo 3D…</div>
<script>const v=document.getElementById('viewer'),s=document.getElementById('status');v.addEventListener('load',()=>s.hidden=true);v.addEventListener('error',()=>{s.hidden=false;s.textContent='No se pudo cargar modelo.glb. Publica index.html y modelo.glb juntos en la raíz de GitHub Pages. No abras el HTML directamente desde Finder.'});</script></body></html>
